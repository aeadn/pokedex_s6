name: Deploy

run-name: ${{ github.actor }} is deploying

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: github-actions/partie-3

jobs:
  e2e_tests:
    name: Run end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Set github user
        run: git config user.email "test@example.com" && git config user.name "CI/CD"
      - name: Install the dependencies
        run: npm ci
      - name: Install playwright
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test --project=chromium --grep @smoke
      - name: Run non-smoke tests
        run: npx playwright test --project=chromium --grep-invert @smoke

  unit_tests:
    name: Run lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Set github user
        run: git config --global user.email "test@example.com" && git config --global user.name "CI/CD"
      - name: Install the dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Run unit tests
        run: npm run test -- --run

  build:
    name: Generate build
    timeout-minutes: 10
    needs: [e2e_tests, unit_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Set github user
        run: git config --global user.email "test@example.com" && git config --global user.name "CI/CD"
      - name: Install the dependencies
        run: npm ci
      - name: Create env vars
        run: |
          echo "VITE_BUILD_DATE=$(date +'%d/%m/%Y %H:%M:%S')" >> "$GITHUB_ENV"
          echo "VITE_BUILD_AUTHOR=${{ github.actor }}" >> "$GITHUB_ENV"
      - name: Create build
        run: npm run build
      - name: Protect env files
        run: |
          cat > dist/.htaccess <<'EOF'
          <FilesMatch "^\.env">
              Require all denied
          </FilesMatch>
          EOF
      - name: Generate artifact
        uses: actions/upload-artifact@v4
        with:
          name: front-end-build
          path: github-actions/partie-3/dist
          include-hidden-files: true

  deploy:
    name: Deploy build to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: front-end-build
          path: front-end-build
      - name: Fill ssh key
        run: echo "${{ secrets.SSH_KEY }}" > ~/deploy_key && chmod 400 ~/deploy_key
        working-directory: .
      - name: Move files
        run: rsync -Pavz --delete -e "ssh -i ~/deploy_key -o StrictHostKeyChecking=no" front-end-build/ ${{ secrets.USER }}@${{ secrets.SERVER }}:~/www/
        working-directory: .
