name: Deploy

run-name: ${{ github.actor }} is deploying

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: github-actions/partie-3

jobs:
  e2e_tests:
    name: Run end-to-end tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test --project=chromium --grep @smoke
      - name: Run non-smoke tests
        run: npx playwright test --project=chromium --grep-invert @smoke

  unit_tests:
    name: Run lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install the dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Run unit tests
        run: npm run test -- --run

  build:
    name: Generate build
    timeout-minutes: 10
    needs: [e2e_tests, unit_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install the dependencies
        run: npm ci
      - name: Create env vars
        run: |
          echo "VITE_BUILD_DATE=$(date +'%d/%m/%Y %H:%M:%S')" >> "$GITHUB_ENV"
          echo "VITE_BUILD_AUTHOR=${{ github.actor }}" >> "$GITHUB_ENV"
      - name: Create build
        run: npm run build
      - name: Add initial game covers
        run: mkdir -p dist/uploads && cp server/uploads/* dist/uploads/
      - name: Protect env files
        run: |
          cat > dist/.htaccess <<'EOF'
          <FilesMatch "^\.env">
              Require all denied
          </FilesMatch>

          RewriteEngine On
          RewriteRule ^games/?$ backend.php?action=games [L,QSA]
          RewriteRule ^upload/?$ backend.php?action=upload [L,QSA]
          RewriteRule ^uploads/list/?$ backend.php?action=list [L,QSA]
          RewriteRule ^uploads/game-covers/?$ backend.php?action=covers [L,QSA]
          RewriteRule ^github/contributors/?$ backend.php?action=contributors [L,QSA]
          EOF
      - name: Generate artifact
        uses: actions/upload-artifact@v4
        with:
          name: front-end-build
          path: github-actions/partie-3/dist
          include-hidden-files: true

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: front-end-build
          path: github-actions/partie-3/dist
      - name: Show build content
        run: find "${{ github.workspace }}/github-actions/partie-3/dist" -maxdepth 3 -type f -print
        working-directory: .
      - name: Show deployment destination
        run: echo "rsync github-actions/partie-3/dist/ -> ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER }}:/home/pokedexmmi/www/"
        working-directory: .
      - name: Configure SSH key
        run: echo "${{ secrets.SSH_KEY }}" > ~/deploy_key && chmod 400 ~/deploy_key
        working-directory: .
      - name: Upload initial game covers without deleting uploaded files
        run: rsync -Pavz --ignore-existing -e "ssh -i ~/deploy_key -o StrictHostKeyChecking=no" "${{ github.workspace }}/github-actions/partie-3/dist/uploads/" ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER }}:/home/pokedexmmi/www/uploads/
        working-directory: .
      - name: Deploy files
        run: rsync -Pavz --delete --exclude 'uploads/' -e "ssh -i ~/deploy_key -o StrictHostKeyChecking=no" "${{ github.workspace }}/github-actions/partie-3/dist/" ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER }}:/home/pokedexmmi/www/
        working-directory: .
